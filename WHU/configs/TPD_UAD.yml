# TPD: three-level prototype discrimination.
# RGB/NIR 0.60/0.20/0.10; TIR 0.80/0.10/0.05; each query total = 1.0.
# 4-GPU DDP, per-GPU 192 images (64 x 3), global batch 256, LR 0.032, 120 epochs.
# Single GPU: override SOLVER.IMS_PER_BATCH 64 and SOLVER.BASE_LR 0.008.
MODEL:
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: 'jx_vit_base_p16_224-80ecf9dd.pth'
  METRIC_LOSS_TYPE: 'wrt'
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  TRANSFORMER_TYPE: 'vit_base_in'
  STRIDE_SIZE: [16, 16]
  PCA_LOSS_WEIGHT: 0.01
  GPD_MOMENTUM: 0.2

  # TPD
  GPD_TYPE: 'tpd'
  GPD_SUB_CENTERS: 3
  GPD_TPD_OWN_WEIGHT: [0.6, 0.6, 0.8]
  GPD_TPD_GLOBAL_WEIGHT: [0.2, 0.2, 0.1]
  GPD_TPD_CROSS_WEIGHT: [0.1, 0.1, 0.05]
  GPD_SHARED_MOMENTUM: 0.2
  GPD_TAU: 0.03
  GPD_COUNT_EMA: True
  GPD_EMA_MIN: 0.1
  GPD_EMA_MAX: 0.5
  GPD_WARMSTART: True
  GPD_DIAG_PERIOD: 100

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: ('WHU-MARS')
  ROOT_DIR: ('/project/code/data')
  MODALITIES: ['RGB', 'IR', 'Thermal']

DATALOADER:
  SAMPLER: 'PKM'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.032
  IMS_PER_BATCH: 256
  SEED: 1234
  WARMUP_METHOD: 'linear'
  WARMUP_EPOCHS: 5
  CHECKPOINT_PERIOD: 20
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  WEIGHT_DECAY: 1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2
  LOSS_TYPE: "base+pca+gpd"

TEST:
  IMS_PER_BATCH: 512
  RE_RANKING: False
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: './logs/TPD_1000_DDP'
